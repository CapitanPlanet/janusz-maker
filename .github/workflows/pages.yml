name: Deploy Blazor to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Blazor WASM
        run: |
          cd engine-csharp
          dotnet publish -c Release -o ../publish
      - name: Fix base href for GitHub Pages
        run: |
          # GitHub Pages jest pod /janusz-maker/, nie pod /
          sed -i 's|<base href="/" />|<base href="/janusz-maker/" />|g' publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
          # Kopiujemy index jako 404 dla SPA routing
          cp publish/wwwroot/index.html publish/wwwroot/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./publish/wwwroot
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
